<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Chamados</title> <!-- Título da Página -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="container">
        <h1><i class="fa-solid fa-headset"></i> HelpDesk</h1>

        <p class="subtitulo"> Registre sua solicitação de suporte técnico. <!-- Subtítulos --> </p>


        <form id="formChamado"> <!-- Início do formulário -->

            <label for="solicitante">*Nome do solicitante:</label>
            <input type="text" id="solicitante" name="solicitante" required placeholder="Digite seu nome">

            <label for="setor">*Setor do solicitante:</label>

            <select id="setor" required>
                <option value="" disabled selected>Selecione o seu setor</option>
                <option value="Administrativo">Administrativo</option>
                <option value="Comercial">Comercial</option>
                <option value="Financeiro">Financeiro</option>
                <option value="RH">RH</option>

            </select>

            <label for="categoria">*Categoria do problema:</label>

            <select id="categoria" required>

                <option value="" disabled selected>
                    Selecione uma categoria
                </option>
                <option value="hardware">Hardware</option>
                <option value="software">Software</option>
                <option value="rede">Rede</option>
                <option value="acesso">Acesso</option>
                <option value="outros">Outros</option>

            </select>

            <label for="prioridade">*Prioridade:</label>

            <select id="prioridade" name="prioridade" required>

                <option value="" disabled selected>
                    Selecione a prioridade
                </option>
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
                <option value="urgente">Urgente</option>

            </select>

            <label for="assunto">Assunto:</label>
            <input type="text" id="assunto" placeholder="Ex.: Erro ao acessar sistema">

            <label for="descricao">*Descrição da solicitação:</label>
            <textarea id="descricao" rows="5" placeholder="Descreva o problema..." required></textarea>

            <button type="submit"> Registrar Chamado </button>

        </form>

       <!-- <h2>Chamados Abertos</h2>
        <div id="listaChamados"></div>-->


    </main>

    <script src="script.js"></script>

    <div id="toast" class="toast">Chamado registrado!</div>

</body>

</html>
